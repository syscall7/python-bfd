<table class="blue-white-table"  ng-controller="SectionsController">
    <tbody><tr>
        <th>Name</th>
        <th>Size</th>
        <th>VMA</th>
        <th>Flags</th>
        <th>Alignment</th>
    </tr>
    
        <tr class="even" ng-repeat="section in sections">
            <td>{{ section.name }}</td>
            <td align="right">{{ section.size }} bytes</td>
            <td align="right">{{ section.vma }} </td>
            <td align="left">

                <span ng-class="['FLAG_ALLOC', 'label']"
                    data-original-title=""
                    ng-repeat="flag in section.flags"
                    style="margin-right:5px;"
                    >

                    {{ getFlagText(flag.name) }}
                </span>

                   <!-- <span class="FLAG_ALLOC label label-success" data-original-title="">
                        ALLOC
                    </span>&nbsp;
                
                    <span class="FLAG_LOAD label label-warning" data-original-title="">
                        LOAD
                    </span>&nbsp;
                
                    <span class="FLAG_DATA label label-success" data-original-title="">
                        DATA
                    </span>&nbsp;
                
                    <span class="FLAG_CONTENTS label label-info" data-original-title="">
                        CONTENTS
                    </span>&nbsp; -->
                
            </td>
            <td align="right">2<sup>0</sup></td>
        </tr>
    
</tbody></table>
