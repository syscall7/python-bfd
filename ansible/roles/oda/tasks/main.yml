- fail: msg="Must specify oda_source_path"
  when: oda_source_path is not defined or oda_source_path == None or oda_source_path == ""
- fail: msg="Must specify oda_install_path"
  when: oda_install_path is not defined or oda_install_path == None or oda_install_path == ""

- name: Install app packages
  apt:
    name: "{{ item }}"
    update_cache: yes
    cache_valid_time: 3600
  with_items:
    - libxml2-dev
    - libxslt1-dev
    - texinfo
    - patch
    - gcc
    - make
    - autoconf
    - texinfo
    - bzip2
    - cython
    - libpython-dev
    - libmysqlclient-dev
    - libssl-dev
    - libffi-dev
  become: yes

- name: Check BFD library status
  stat:
    path: /usr/local/oda/lib/libbfd.a
  register: bfd
  changed_when: false

- name: Build and install BFD library
  command: ./build_bfd.sh chdir="{{ oda_source_path }}/bfd"
  when: not bfd.stat.exists

- name: Create site directory
  file:
    name: "{{ oda_install_path }}"
    state: directory
    owner: "{{ oda_user }}"
    group: "{{ oda_group }}"

- name: Copy site files
  synchronize:
    src: "{{ oda_source_path }}/oda_workspace/"
    dest: "{{ oda_install_path }}/site"
  delegate_to: "{{ inventory_hostname }}"

- name: Initiate virtualenv
  pip:
    virtualenv: "{{ oda_install_path }}/env"
    virtualenv_python: python2.7
    requirements: "{{ oda_install_path }}/site/requirements.txt"

- name: Check BFD Python library status
  command: "{{ oda_install_path }}/env/bin/pip show PythonBFD"
  register: python_bfd
  changed_when: false
  failed_when: false

- name: Install BFD python wrapper
  pip:
    name: "file://{{ oda_source_path }}/bfd"
    virtualenv: "{{ oda_install_path }}/env"
  when: python_bfd.rc != 0

- name: Set default virtualenv in .profile
  lineinfile:
    dest: "~{{ oda_user }}/.profile"
    line: "source {{ oda_install_path }}/env/bin/activate"

- name: Install .env file
  template:
    src: env.j2
    dest: "{{ oda_install_path }}/site/.env"
    owner: "{{ oda_user }}"
    group: "{{ oda_group }}"

- name: Create media directories
  file:
    name: "{{ oda_django_media_root }}/{{ item }}"
    state: directory
    owner: "{{ oda_user }}"
    group: "{{ oda_group }}"
  with_items:
    - cache
    - uploads

- block:
  - set_fact:
      oda_django_manage: "{{ oda_install_path }}/env/bin/python {{ oda_install_path }}/site/manage.py"

  - name: Check database migration status
    shell: "{{ oda_django_manage }} showmigrations --list | grep '\\[ \\]'"
    register: oda_migration_status
    changed_when: false
    failed_when: false

  - name: Migrate database
    command: "{{ oda_django_manage }} migrate --settings {{ oda_django_settings }}"
    when: oda_migration_status.rc == 0

  - name: Run app setup scripts
    command: "{{ oda_django_manage }} setup_oda --settings {{ oda_django_settings }}"
    with_items:
      - setup_oda
      - setup_openid
    changed_when: false

  environment: "{{ oda_environment }}"
