<div id="slider" style="margin-bottom: 20px; margin-top: 15px; margin-right: 15px; border: 0px"
     ng-controller="SliderController"
     slider="sliderOptions">
    <table id="slider-sections">
        <tr>
            <td ng-repeat="section in sections"
                bgcolor="{{  getSectionColor(section) }}"
                style="border:1px solid #ffffff; width:{{ getSectionWidth(section) }}">
            </td>
        </tr>
    </table>
</div>
<div id="slider-address" style="color:gray; font-family:monospace; margin-right: 15px; float:right">0</div>
